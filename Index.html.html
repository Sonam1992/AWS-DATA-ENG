-- Shows dirty data (Order 1005) - we will fix in Glue ETL next`}]},{id:"glue-etl",number:"07",title:"Transform with Glue Studio (Visual ETL)",icon:Fr,goal:"Clean dirty data visually: Remove rows where Amount=0, drop duplicates. No code needed first, then see auto-generated PySpark.",breadcrumb:["Glue","Glue Studio","Visual ETL","Create Job"],clicks:["Go to Glue → Left menu: ETL Jobs → Visual ETL → Click 'Create job' (Visual with a source and target)","Left Nodes panel: Add Source → AWS Glue Data Catalog → Database: sales_db, Table: your table → It appears as node","Click Source node → In right panel: Check data preview - should show rows","Add Transform: Click Transform → Drop Duplicates → Connect source to it","Add another Transform: Filter → Condition: Amount > 0 (removes free/bad orders) → Connect","Add Target: S3 → Format: Parquet (better than CSV!), Compression: Snappy, S3 location: s3://my-datalake-processed-YOURNAME-2024/clean/ , Format Options: Check 'Partition keys' none for now","Top: Job details tab → Name: sales-clean-job, IAM Role: GlueLabRole, Worker type: G.1X, Number of workers: 2, Job bookmark: Disable (for lab)","Save (top-right) → Click Run → Go to 'Runs' tab → Wait 2-4 mins → Status: Succeeded","Check S3 processed bucket → clean/ folder now has Parquet files! Run Crawler again on processed bucket to catalog clean data."],screenshot:"Screenshot: Glue Studio Visual ETL Canvas > 4 boxes connected: Source (Catalog) -> DropDuplicates -> Filter -> Target S3 (Parquet) > Job Details showing GlueLabRole > Run button + Succeeded status",expected:"Job Run = Succeeded, Duration ~2min, S3 clean/ has 1-2 parquet files (not CSV). Athena can now query clean data faster.",mistake:"Job fails 'Insufficient Lake Formation permissions'. FIX: In Glue Studio, if it asks for Lake Formation, click 'Disable Lake Formation' or go to Lake Formation > Settings > Uncheck 'Use only IAM'. Or use older Glue console.",code:[{label:"Auto-Generated PySpark (What Glue writes for you)",content:`import sys
from awsglue.transforms import *
from awsglue.utils import getResolvedOptions
from pyspark.context import SparkContext
from awsglue.context import GlueContext

args = getResolvedOptions(sys.argv, ['JOB_NAME'])
sc = SparkContext()
glueContext = GlueContext(sc)
spark = glueContext.spark_session

# Source: Read from Catalog
sales_db = glueContext.create_dynamic_frame.from_catalog(
  database="sales_db", 
  table_name="incoming"
)

# Transform: Drop Duplicates
DropDuplicates = DynamicFrame.dropDuplicates(sales_db)

# Transform: Filter Amount > 0
Filter = Filter.apply(
  frame=DropDuplicates, 
  f=lambda x: x["Amount"] > 0
)

# Target: Write Parquet to Processed

glueContext.write_dynamic_frame.from_options(
  frame=Filter,
  connection_type="s3",
  format="parquet",
  connection_options={
    "path": "s3://my-datalake-processed-YOURNAME-2024/clean/"
  }
)`}]},{id:"lambda",number:"08",title:"Lambda Trigger (Event-Driven)",icon:Vt,goal:"Make pipeline automatic: When new file lands in Raw S3, Lambda auto-triggers. Serverless = No server to manage.",breadcrumb:["AWS Console","Search: Lambda","Create function","Add trigger"],clicks:["Search 'Lambda' → Functions → Create function → Author from scratch","Function name: s3-new-file-logger, Runtime: Python 3.12, Architecture: x86_64, Permissions: Create new role with basic Lambda permissions","Create function → You land in code editor","Paste Python code below in code editor → Click Deploy (important!)","Click 'Add trigger' → Select S3 → Bucket: my-datalake-raw-YOURNAME-2024 → Event type: All object create events → Check 'I acknowledge...' → Add","Test: Go to S3 raw bucket → Upload a new file test.txt → Go to Lambda → Monitor → Logs → CloudWatch Logs → See log entry with file name! Magic!"],screenshot:"Screenshot: Lambda > Function code editor with Python code + Add Trigger modal showing S3 bucket selection + CloudWatch Logs showing 'New file detected: test.txt'",expected:"Trigger added successfully. When you upload file to S3, Lambda executes and log shows file name. Check CloudWatch Logs to confirm.",mistake:"Trigger fails: 'Need to add permission'. FIX: S3 trigger needs Lambda permission. Delete trigger, recreate, check acknowledgment box. Or Lambda role missing S3 read.",code:[{label:"lambda_function.py",content:`import json
import urllib.parse

def lambda_handler(event, context):
    # This runs automatically when file uploaded to S3
    print("New file event received!")
    print(json.dumps(event, indent=2))
    
    # Extract file info
    for record in event['Records']:
        bucket = record['s3']['bucket']['name']
        key = urllib.parse.unquote_plus(record['s3']['object']['key'])
        print(f"New file in bucket: {bucket}")
        print(f"File path: {key}")
        print(f"File size: {record['s3']['object'].get('size', 'unknown')} bytes")
    
    return {
        'statusCode': 200,
        'body': json.dumps(f'Successfully processed {key}')
    }

# What to tell students:
